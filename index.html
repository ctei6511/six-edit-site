<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>six edit</title>
<meta name="description" content="six edit. a considered edit from the black and white store.">
<style>
  :root{
    --ink:#111111;
    --paper:#ffffff;
    --muted:#6e6e6e;
    --line:#dcdad5;
  }
  *{box-sizing:border-box;}
  html{-webkit-font-smoothing:antialiased; scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
    line-height:1.5;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{ max-width:1280px; margin:0 auto; padding:0 32px; }
  a{ color:inherit; }
  hr.rule{ border:none; border-top:1px solid var(--line); margin:0; }



  header{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 0;
    gap:16px;
  }
  .nav-links{
    display:flex;
    gap:22px;
    font-size:10px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-weight:400;
  }
  .nav-links a{
    text-decoration:none;
    border-bottom:1px solid transparent;
    padding-bottom:3px;
    transition:border-color .2s ease;
  }
  .nav-links a:hover, .nav-links a:focus-visible{ border-color:var(--ink); }
  .nav-cta{ justify-self:end; }
  .nav-cta a{
    font-size:9px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-weight:400;
    text-decoration:none;
    border:1px solid var(--ink);
    padding:9px 16px;
    display:inline-block;
    transition:background .2s ease, color .2s ease;
  }
  .nav-cta a:hover, .nav-cta a:focus-visible{ background:var(--ink); color:var(--paper); }
  .nav-burger{
    display:none;
    background:none;
    border:none;
    font-size:10px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    font-weight:400;
    cursor:pointer;
    color:var(--ink);
    padding:0;
    justify-self:start;
  }
  .mobile-panel{ display:none; }

  .hero{
    position:relative;
    min-height:88vh;
    display:flex;
    align-items:flex-end;
    padding:48px 0 64px;
    background:
      repeating-linear-gradient(115deg, #f2f2f0 0 2px, transparent 2px 42px),
      var(--paper);
    background-size:cover;
    background-position:center;
    border-bottom:1px solid var(--line);
  }
  /* once you have a banner photo, add style="background-image:url('hero-banner.jpg')" to the .hero section below — inline styles beat this default pattern */
  .hero-inner{ position:relative; z-index:1; width:100%; }
  .hero.has-photo::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.18);
  }
  .hero.has-photo h1{ color:var(--paper); }
  .hero.has-photo .btn{
    color:var(--paper);
    border-color:var(--paper);
  }
  .hero.has-photo .btn:hover,
  .hero.has-photo .btn:focus-visible{
    background:var(--paper);
    color:var(--ink);
  }
  .hero h1{
    font-size:clamp(20px,3vw,30px);
    line-height:1.1;
    letter-spacing:0.55em;
    margin:0 0 20px;
    text-transform:lowercase;
    font-weight:300;
  }
  .hero-row{ display:flex; }
  .btn{
    display:inline-block;
    font-size:12px;
    font-weight:400;
    letter-spacing:0.06em;
    text-transform:lowercase;
    text-decoration:none;
    color:var(--ink);
    padding:12px 24px;
    border:1px solid var(--ink);
    transition:background .2s ease, color .2s ease;
    white-space:nowrap;
  }
  .btn:hover, .btn:focus-visible{ background:var(--ink); color:var(--paper); }

  .shipping-strip{
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding:14px 0;
  }
  .shipping-strip a{
    font-size:13px;
    letter-spacing:0.02em;
    text-decoration:none;
    color:var(--ink);
  }

  .float-newsletter{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:30;
    width:260px;
    background:var(--paper);
    border:1px solid var(--ink);
    padding:18px 18px 16px;
    transform:translateY(12px);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
  }
  .float-newsletter.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .float-newsletter p{
    font-size:10px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    line-height:1.5;
    margin:0 0 12px;
    padding-right:14px;
  }
  .float-newsletter form{
    display:flex;
    border-bottom:1px solid var(--ink);
  }
  .float-newsletter input{
    flex:1;
    border:none;
    font-size:11px;
    padding:6px 2px;
    font-family:inherit;
  }
  .float-newsletter input:focus{ outline:none; }
  .float-newsletter button{
    background:none;
    border:none;
    font-size:9px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    cursor:pointer;
    padding:6px 2px;
    font-family:inherit;
  }
  .float-newsletter-close{
    position:absolute;
    top:8px;
    right:8px;
    background:none;
    border:none;
    font-size:11px;
    line-height:1;
    cursor:pointer;
    color:var(--muted);
    padding:4px;
  }
  .float-newsletter-close:hover{ color:var(--ink); }
  .float-newsletter-note{
    font-size:9px;
    letter-spacing:0.02em;
    text-transform:none;
    color:var(--muted);
    margin-top:8px;
    display:block;
  }


  #the-edit{ padding:40px 12px; }
  .feature-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(2,1fr);
    gap:20px;
    margin-bottom:0;
  }
  .feature-large{
    grid-column:1 / 3;
    grid-row:1 / 3;
    display:block;
    overflow:hidden;
    background:var(--paper);
  }
  .feature-large img{ width:100%; height:100%; object-fit:cover; display:block; }
  .feature-small{
    position:relative;
    display:block;
    aspect-ratio:3/4;
    overflow:hidden;
    background:var(--paper);
  }
  .feature-small img{ width:100%; height:100%; object-fit:cover; display:block; }
  .feature-small-label{
    position:absolute;
    bottom:10px;
    left:10px;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--paper);
    background:rgba(17,17,17,0.7);
    padding:3px 7px;
  }



  footer{ padding:24px 0; }
  .footer-links{
    display:flex;
    flex-wrap:wrap;
    gap:18px;
    padding-bottom:14px;
    font-size:10px;
    letter-spacing:0.04em;
    text-transform:uppercase;
  }
  .footer-links a{
    text-decoration:none;
    color:var(--ink);
    border-bottom:1px solid transparent;
  }
  .footer-links a:hover, .footer-links a:focus-visible{ border-color:var(--ink); }
  .footer-bottom{
    padding-top:14px;
    font-size:10px;
    color:var(--muted);
    letter-spacing:0.04em;
  }

  @media (max-width:720px){
    .wrap{ padding:0 20px; }
    #the-edit{ padding:28px 16px; }
    .nav-links{ display:none; }
    .nav-burger{ display:block; padding:10px 0; }
    .nav-cta a{ padding:11px 16px; }
    .mobile-panel.open{
      display:flex;
      flex-direction:column;
      gap:20px;
      padding:20px 20px 26px;
      border-top:1px solid var(--line);
      font-size:12px;
      letter-spacing:0.06em;
      text-transform:uppercase;
      font-weight:400;
    }
    .mobile-panel a{ display:block; padding:6px 0; text-decoration:none; }
    .hero{ min-height:auto; padding:56px 0; }
    .hero h1{ letter-spacing:0.35em; }
    .feature-grid{ grid-template-columns:repeat(2,1fr); grid-template-rows:auto; gap:12px; }
    .feature-large{ grid-column:1 / 3; grid-row:auto; aspect-ratio:3/4; }
    .float-newsletter{ width:calc(100% - 40px); right:20px; left:20px; }
    .float-newsletter input{ font-size:16px; }
  }
</style>
</head>
<body>

<header id="top">
  <div class="wrap">
    <nav class="nav">
      <button class="nav-burger" id="burger" aria-expanded="false" aria-controls="mobile-panel">menu</button>
      <div class="nav-links">
        <a href="#the-edit">the edit</a>
        <a href="shop.html">shop</a>
      </div>
      <div class="nav-cta">
        <a href="shop.html">shop six edit</a>
      </div>
    </nav>
  </div>
  <div class="mobile-panel" id="mobile-panel">
    <a href="#the-edit">the edit</a>
    <a href="shop.html">shop</a>
  </div>
</header>

<!-- to add your banner photo: change the line below to
     <section class="hero has-photo" style="background-image:url('hero-banner.jpg')">
     the has-photo class adds a subtle dark overlay so the white text stays readable -->
<section class="hero has-photo" style="background-image:url('hero-banner.jpg')">
  <div class="wrap hero-inner">
    <h1>six edit</h1>
    <div class="hero-row">
      <a class="btn" href="shop.html">shop</a>
    </div>
  </div>
</section>

<div class="wrap" id="the-edit">
  <div class="feature-grid">

    <a class="feature-large" href="shop.html">
      <img src="feature.jpg" alt="six edit" loading="lazy" decoding="async">
    </a>

    <a class="feature-small" href="shop.html">
      <img src="piece-one.jpg" alt="01" loading="lazy" decoding="async">
      <span class="feature-small-label">01</span>
    </a>

    <a class="feature-small" href="shop.html">
      <img src="piece-two.jpg" alt="02" loading="lazy" decoding="async">
      <span class="feature-small-label">02</span>
    </a>

    <a class="feature-small" href="shop.html">
      <img src="piece-three.jpg" alt="03" loading="lazy" decoding="async">
      <span class="feature-small-label">03</span>
    </a>

    <a class="feature-small" href="shop.html">
      <img src="piece-four.jpg" alt="04" loading="lazy" decoding="async">
      <span class="feature-small-label">04</span>
    </a>

  </div>
</div>

<div class="wrap shipping-strip">
  <a href="#top">back to top</a>
</div>



<footer>
  <div class="wrap">
    <div class="footer-links">
      <a href="https://theblackandwhite.store/pages/faq" target="_blank" rel="noopener">faq</a>
      <a href="https://theblackandwhite.store/pages/returns" target="_blank" rel="noopener">returns</a>
      <a href="mailto:info@theblackandwhite.store">contact</a>
      <a href="https://theblackandwhite.store/policies/terms-of-service" target="_blank" rel="noopener">terms</a>
      <a href="https://theblackandwhite.store/policies/privacy-policy" target="_blank" rel="noopener">privacy</a>
    </div>
    <hr class="rule">
    <div class="footer-bottom">
      <span>six edit © 2026</span>
    </div>
  </div>
</footer>

<div class="float-newsletter" id="float-newsletter">
  <button class="float-newsletter-close" id="float-newsletter-close" aria-label="close">✕</button>
  <p>be first to the next edit</p>
  <form id="klaviyo-form">
    <input type="email" id="klaviyo-email" placeholder="email" required>
    <button type="submit">join</button>
  </form>
  <span class="float-newsletter-note" id="klaviyo-note"></span>
</div>

<script>
  var burger = document.getElementById('burger');
  var panel = document.getElementById('mobile-panel');
  burger.addEventListener('click', function(){
    var open = panel.classList.toggle('open');
    burger.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  // floating newsletter: show once per session, dismissible
  var floatBox = document.getElementById('float-newsletter');
  var floatClose = document.getElementById('float-newsletter-close');
  if(!sessionStorage.getItem('sixEditNewsletterDismissed')){
    setTimeout(function(){ floatBox.classList.add('show'); }, 4000);
  }
  floatClose.addEventListener('click', function(){
    floatBox.classList.remove('show');
    sessionStorage.setItem('sixEditNewsletterDismissed', '1');
  });

  // ---- klaviyo signup ----
  // replace these two values with your own, see the walkthrough
  var KLAVIYO_PUBLIC_KEY = 'YOUR_PUBLIC_API_KEY'; // Klaviyo > Settings > API Keys > Public Key / Site ID
  var KLAVIYO_LIST_ID = 'YOUR_LIST_ID';           // Klaviyo > Lists > open your list > the ID is in the URL

  document.getElementById('klaviyo-form').addEventListener('submit', function(e){
    e.preventDefault();
    var email = document.getElementById('klaviyo-email').value;
    var note = document.getElementById('klaviyo-note');
    note.textContent = 'joining...';

    fetch('https://a.klaviyo.com/client/subscriptions?company_id=' + KLAVIYO_PUBLIC_KEY, {
      method: 'POST',
      headers: {
        'Accept': 'application/vnd.api+json',
        'Content-Type': 'application/vnd.api+json',
        'revision': '2024-10-15'
      },
      body: JSON.stringify({
        data: {
          type: 'subscription',
          attributes: {
            profile: {
              data: {
                type: 'profile',
                attributes: { email: email }
              }
            }
          },
          relationships: {
            list: {
              data: { type: 'list', id: KLAVIYO_LIST_ID }
            }
          }
        }
      })
    }).then(function(res){
      if(res.ok){
        note.textContent = 'you\'re on the list';
        document.getElementById('klaviyo-email').value = '';
      } else {
        note.textContent = 'something went wrong, try again';
      }
    }).catch(function(){
      note.textContent = 'something went wrong, try again';
    });
  });
</script>

</body>
</html>
